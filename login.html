<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion | Invierte con Gabo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 100px 24px 40px; }
        .auth-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 48px; width: 100%; max-width: 460px; backdrop-filter: blur(12px); }
        .auth-logo { font-family: var(--font-heading); font-size: 1.4rem; font-weight: 800; color: var(--text-primary); text-decoration: none; display: block; text-align: center; margin-bottom: 32px; }
        .auth-logo span { color: var(--accent); }
        .auth-tabs { display: flex; background-color: rgba(255,255,255,0.04); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 32px; }
        .auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-family: var(--font-heading); font-weight: 600; font-size: 0.95rem; cursor: pointer; border-radius: 6px; transition: var(--transition-fast); }
        .auth-tab.active { background-color: var(--accent); color: var(--text-dark); }
        .auth-form { display: flex; flex-direction: column; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .form-input { width: 100%; padding: 14px 44px 14px 18px; background-color: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-body); font-size: 1rem; transition: var(--transition-fast); outline: none; }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .form-input::placeholder { color: rgba(156,163,175,0.5); }
        .toggle-password { position: absolute; right: 14px; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; transition: var(--transition-fast); }
        .toggle-password:hover { color: var(--accent); }
        .toggle-password svg { width: 20px; height: 20px; }
        .btn-auth { padding: 15px; background: var(--accent-gradient); color: var(--text-dark); border: none; border-radius: var(--radius-sm); font-family: var(--font-heading); font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition-fast); margin-top: 6px; }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,185,11,0.3); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-message { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 500; display: none; text-align: center; }
        .auth-message.success { background-color: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #10B981; display: block; }
        .auth-message.error { background-color: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #EF4444; display: block; }
        .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; background-color: #ffffff; color: #333333; border: 1px solid #ddd; border-radius: var(--radius-sm); font-family: var(--font-heading); font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: var(--transition-fast); margin-bottom: 20px; }
        .btn-google:hover { background-color: #f8f9fa; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
        .divider { display: flex; align-items: center; text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider span { padding: 0 10px; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 18px; }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">invierte<span>con</span>gabo</a>
        </div>
    </header>
    <main class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">invierte<span>con</span>gabo</a>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Iniciar Sesion</button>
                <button class="auth-tab" id="tabRegister">Crear Cuenta</button>
            </div>
            <div class="auth-message" id="authMessage"></div>
            
            <!-- Iniciar Sesion -->
            <div class="tab-content active" id="loginForm">
                <button type="button" class="btn-google" id="btnGoogleLogin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continuar con Google
                </button>
                <div class="divider"><span>o iniciar sesión con correo</span></div>
                
                <div class="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Correo electronico</label>
                        <input type="email" id="loginEmail" class="form-input" placeholder="tu@correo.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Contrasena</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" class="form-input" placeholder="Tu contrasena">
                            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Mostrar u ocultar contrasena">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="btn-auth" id="btnLogin">Iniciar Sesion &rarr;</button>
                </div>
            </div>
            
            <!-- Crear Cuenta -->
            <div class="tab-content" id="registerForm">
                <button type="button" class="btn-google" id="btnGoogleRegister">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Registrarse con Google
                </button>
                <div class="divider"><span>o registrarse con correo</span></div>
                
                <div class="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="registerName">Tu nombre</label>
                        <input type="text" id="registerName" class="form-input" placeholder="Ej: Gabriel">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerEmail">Correo electronico</label>
                        <input type="email" id="registerEmail" class="form-input" placeholder="tu@correo.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Contrasena</label>
                        <div class="password-wrapper">
                            <input type="password" id="registerPassword" class="form-input" placeholder="Minimo 6 caracteres">
                            <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Mostrar u ocultar contrasena">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerConfirmPassword">Confirmar contrasena</label>
                        <div class="password-wrapper">
                            <input type="password" id="registerConfirmPassword" class="form-input" placeholder="Repite tu contrasena">
                            <button type="button" class="toggle-password" data-target="registerConfirmPassword" aria-label="Mostrar u ocultar contrasena">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="btn-auth" id="btnRegister">Crear mi Cuenta &rarr;</button>
                </div>
            </div>
            
            <div class="auth-footer">
                <a href="index.html">&larr; Volver a la pagina principal</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        const SUPABASE_URL = 'https://uyrcsfsqzkywrgrjkvbr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SBBWsktsWGJLNa0-2Y4_wQ_sPeHJnHa';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authMessage = document.getElementById('authMessage');
        
        function showMsg(text, type) { authMessage.textContent = text; authMessage.className = 'auth-message ' + type; }
        function clearMsg() { authMessage.className = 'auth-message'; authMessage.textContent = ''; }
        
        tabLogin.addEventListener('click', () => { tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.classList.add('active'); registerForm.classList.remove('active'); clearMsg(); });
        tabRegister.addEventListener('click', () => { tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.classList.add('active'); loginForm.classList.remove('active'); clearMsg(); });
        
        // --- Ojitos para ver contrasena ---
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
                } else {
                    input.type = 'password';
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                }
            });
        });
        
        // --- Iniciar Sesion ---
        async function signInWithGoogle() {
            const currentUrl = window.location.href;
            const redirectUrl = currentUrl.replace('login.html', 'dashboard.html');
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: redirectUrl
                }
            });
            if (error) {
                showMsg(error.message, 'error');
            }
        }

        document.getElementById('btnGoogleLogin').addEventListener('click', signInWithGoogle);
        document.getElementById('btnGoogleRegister').addEventListener('click', signInWithGoogle);

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');
            if (!email || !password) { showMsg('Por favor completa todos los campos.', 'error'); return; }
            btn.disabled = true; btn.textContent = 'Entrando...'; clearMsg();
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { showMsg('Correo o contrasena incorrectos. Intenta de nuevo.', 'error'); btn.disabled = false; btn.textContent = 'Iniciar Sesion'; }
            else { showMsg('Bienvenido! Redirigiendo a tu panel...', 'success'); setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200); }
        });
        
        // --- Crear Cuenta ---
        document.getElementById('btnRegister').addEventListener('click', async () => {
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const btn = document.getElementById('btnRegister');
            
            if (!name || !email || !password || !confirmPassword) { showMsg('Por favor completa todos los campos.', 'error'); return; }
            if (password.length < 6) { showMsg('La contrasena debe tener al menos 6 caracteres.', 'error'); return; }
            if (password !== confirmPassword) { showMsg('Las contrasenas no coinciden. Verificalas bien.', 'error'); return; }
            
            btn.disabled = true; btn.textContent = 'Creando cuenta...'; clearMsg();
            const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
            if (error) { showMsg(error.message || 'Error al crear cuenta. Intenta de nuevo.', 'error'); btn.disabled = false; btn.textContent = 'Crear mi Cuenta'; }
            else { showMsg('Cuenta creada! Revisa tu correo para confirmar y luego inicia sesion.', 'success'); btn.textContent = 'Cuenta creada!'; }
        });
        
        // Se eliminó la redirección automática para evitar loops en local
    </script>
</body>
</html>
